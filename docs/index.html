<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--tx:#e6edf3;--dim:#8b949e;--ok:#3fb950;--bad:#f85149;--warn:#d29922;--ac:#7c6cf0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding:16px;max-width:900px;margin:auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}header img{height:40px;border-radius:8px}h1{font-size:20px;margin:0;flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.name{font-weight:600;flex:1;min-width:160px;word-break:break-all}
.dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}.on{background:var(--ok)}.warn{background:var(--warn)}.off{background:var(--bad)}
.meta{color:var(--dim);font-size:13px}button{background:#21262d;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button:hover{border-color:var(--ac)}button:disabled{opacity:.4;cursor:default}input,select{background:#0d1117;color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit}
input{width:100%}#msg{color:var(--warn);min-height:20px;margin:6px 0;font-size:13px}.stale{color:var(--bad)}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{padding:6px 14px}.tab.act{border-color:var(--ac);background:#2a2650}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}@media(max-width:700px){.board{grid-template-columns:1fr}}
.col{background:#11161d;border:1px solid var(--bd);border-radius:10px;padding:8px;min-height:80px}.col h3{margin:2px 4px 8px;font-size:14px;color:var(--dim);display:flex;justify-content:space-between}
.kc{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;margin-bottom:8px}.kc .t{font-weight:600;word-break:break-word}.kc .s{font-size:12px;color:var(--dim)}
.bd{display:inline-block;font-size:11px;border:1px solid var(--bd);border-radius:10px;padding:0 7px;margin-left:6px}.bd.w{color:var(--warn);border-color:var(--warn)}.bd.e{color:var(--bad);border-color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--dim);font-weight:500}.dis{opacity:.5}

<div id="login" class="card" hidden>
 <p><b>Zugriffs-Token</b> (GitHub fine-grained PAT, nur Repo <code id="repoName"></code>, Contents: Read &amp; Write). Wird nur in diesem Browser gespeichert.</p>
 <div class="row"><input id="tok" type="password" placeholder="github_pat_…" autocomplete="off"><button id="save">Speichern</button></div>
</div>
<div class="tabs"><button class="tab act" data-t="agents">Agenten</button><button class="tab" data-t="board">Board</button><button class="tab" data-t="crons">Cron-Jobs</button></div>
<div id="msg"></div>
<div id="v-agents"><input id="flt" placeholder="Projekt suchen …" style="margin-bottom:10px"><div id="list"></div>
<div id="sess"></div>
<div class="card" id="addbox" hidden><div class="row"><span class="name">Weiteren Agenten starten</span><select id="sel"></select><button id="add">Starten</button></div></div>
</div>
<div id="v-board" hidden><div class="board"><div class="col"><h3>Offen <span id="n-todo"></span></h3><div id="c-todo"></div></div><div class="col"><h3>In Arbeit <span id="n-doing"></span></h3><div id="c-doing"></div></div><div class="col"><h3>Erledigt <span id="n-done"></span></h3><div id="c-done"></div></div></div></div>
<div id="v-crons" hidden><div class="card" style="overflow-x:auto"><table id="cronTable"></table></div></div>
<p class="meta"><a href="#" id="logout" style="color:var(--dim)">Token entfernen</a></p>
<script>
const REPO=(new URLSearchParams(location.search).get("data"))||"rokytnice/agent-hub-data";
const $=id=>document.getElementById(id);let TOK="";try{TOK=localStorage.getItem("ah_tok")||""}catch(e){}
$("repoName").textContent=REPO;
const api=(p,o={})=>fetch(`https://api.github.com/repos/${REPO}/contents/${p}`,{...o,headers:{Authorization:"Bearer "+TOK,Accept:"application/vnd.github+json",...(o.headers||{})}});
const say=t=>$("msg").textContent=t||"";
const ago=s=>s<90?s+" s":s<5400?Math.round(s/60)+" min":Math.round(s/3600)+" h";
const dur=s=>s==null?"–":s<3600?Math.round(s/60)+" min":s<172800?(s/3600).toFixed(1)+" h":Math.round(s/86400)+" d";
let pending={};const res={};
async function load(){
 if(!TOK){$("login").hidden=false;return}
 $("login").hidden=true;
 try{
  const r=await api("status.json",{headers:{Accept:"application/vnd.github.raw+json"},cache:"no-store"});
  if(r.status==401||r.status==403||r.status==404){say("Kein Zugriff ("+r.status+") – Token/Repo prüfen.");return}
  const d=await r.json();render(d);
 }catch(e){say("Fehler: "+e.message)}
}
let LAST=null;
function render(d){
 LAST=d;renderBoard(d);
 const age=Math.round((Date.now()-d.updated)/1000);
 $("seen").innerHTML=`${d.host} · <span class="${age>900?"stale":""}">zuletzt ${ago(age)} her</span>`;
 for(const k in pending){const r=d.results[pending[k]];if(r){res[k]=r;delete pending[k]}}
 const q=($("flt").value||"").toLowerCase();
 const P=(d.projects||[]).filter(p=>p.name.toLowerCase().includes(q));
 const rank=p=>p.active=="active"?0:p.manual?1:2;
 P.sort((a,b)=>rank(a)-rank(b)||a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
 const L=$("list");L.innerHTML="";
 for(const p of P){
  const unit=`claude-agent@${p.name}.service`;const on=p.active=="active";
  const el=document.createElement("div");el.className="card"+(rank(p)==2?" dis":"");
  const info=[on?`${p.sub} · ${dur(p.uptime_s)}${p.mem_mb!=null?" · "+p.mem_mb+" MB":""}`:(p.active?p.active:"inaktiv"),p.manual?p.manual+" manuell":"",p.claude_md?"CLAUDE.md":""].filter(Boolean).join(" · ");
  el.innerHTML=`<div class="row"><span class="dot ${on?"on":p.manual?"warn":""}"></span><span class="name"></span><span class="meta"></span></div>`;
  el.querySelector(".name").textContent=p.name;el.querySelector(".meta").textContent=info;
  const row=el.querySelector(".row");
  for(const [act,lab,show] of [["start","Start",!on],["restart","Neustart",on],["stop","Stopp",on]]){
   if(!show)continue;const b=document.createElement("button");b.textContent=lab;b.disabled=!!pending[unit];
   b.title=act=="stop"?"Beendet den Dienst":"Startet claude --remote-control im Projektordner";
   b.onclick=()=>send(unit,act);row.appendChild(b)}
  if(pending[unit])row.insertAdjacentHTML("beforeend",'<span class="meta">⏳ wartet…</span>');
  const r=res[unit];if(r)row.insertAdjacentHTML("beforeend",`<span class="meta">${r.ok?"✓":"✗ "+esc(r.msg)}</span>`);
  L.appendChild(el)}
 $("addbox").hidden=true;
 const S=$("sess");S.innerHTML="";
}
$("flt").oninput=()=>LAST&&render(LAST);
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const fmt=ts=>ts?new Date(ts*1000).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"}):"–";
function renderBoard(d){
 const b=d.board||{};
 for(const c of ["todo","doing","done"]){
  const arr=b[c]||[];$("n-"+c).textContent=arr.length;
  $("c-"+c).innerHTML=arr.map(x=>`<div class="kc"><div class="t">${esc(x.title)}${x.badge?`<span class="bd ${x.badge=="wartet auf dich"?"w":/error|timeout/.test(x.badge)?"e":""}">${esc(x.badge)}</span>`:""}</div>${x.detail?`<div class="s">${esc(x.detail)}</div>`:""}${x.needs?`<div class="s">❓ ${esc(x.needs)}</div>`:""}<div class="s">${esc(x.src)} · ${new Date(x.ts).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"})}</div></div>`).join("")||'<div class="meta" style="padding:6px">–</div>'}
 const cr=d.crons||[];
 $("cronTable").innerHTML="<tr><th>Art</th><th>Name</th><th>Zeitplan / Nächster Lauf</th><th>Info</th></tr>"+cr.map(x=>`<tr class="${x.enabled?"":"dis"}"><td>${esc(x.kind)}${x.enabled?"":" (aus)"}</td><td>${esc(x.name)}</td><td>${x.kind=="timer"?esc(fmt(x.next)):esc(x.when)}</td><td>${esc(x.detail)}</td></tr>`).join("");
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("act",x==b));for(const v of ["agents","board","crons"])$("v-"+v).hidden=v!=b.dataset.t;try{localStorage.setItem("ah_tab",b.dataset.t)}catch(e){}});
try{const t=localStorage.getItem("ah_tab");if(t)document.querySelector(`.tab[data-t="${t}"]`).click()}catch(e){}
async function send(unit,action){
 const id=Math.random().toString(36).slice(2)+Date.now().toString(36);
 for(let t=0;t<3;t++){
  const r=await api("commands.json",{cache:"no-store"});let cur={commands:[]},sha;
  if(r.ok){const j=await r.json();sha=j.sha;try{cur=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,"")))))}catch(e){}}
  cur.commands=(cur.commands||[]).slice(-30);cur.commands.push({id,unit,action,ts:Date.now()});
  const body={message:"cmd",content:btoa(unescape(encodeURIComponent(JSON.stringify(cur))))};if(sha)body.sha=sha;
  const w=await api("commands.json",{method:"PUT",body:JSON.stringify(body)});
  if(w.ok){pending[unit]=id;say(`${action} ${unit.replace(/^claude-agent@|\.service$/g,"")} gesendet – Ausführung in bis zu ~15 s.`);load();return}
  if(w.status!=409&&w.status!=422){say("Senden fehlgeschlagen ("+w.status+")");return}
 }say("Konflikt – bitte erneut versuchen.")
}
$("save").onclick=()=>{TOK=$("tok").value.trim();try{localStorage.setItem("ah_tok",TOK)}catch(e){}$("tok").value="";load()};
$("logout").onclick=e=>{e.preventDefault();TOK="";try{localStorage.removeItem("ah_tok")}catch(e){}$("list").innerHTML="";load()};
$("add").onclick=()=>send("claude-agent@"+$("sel").value+".service","start");
load();setInterval(load,10000);
</script></body></html>
